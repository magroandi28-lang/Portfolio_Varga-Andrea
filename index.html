<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Act Kontroll</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #060a12;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 13, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-card {
      width: 100%;
      max-width: 720px;
      background: #09101d;
      border: 1px solid #1a2538;
      border-radius: 24px;
      padding: 36px 44px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(234, 88, 12, 0.08);
      color: #ffffff;
      position: relative;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      border: 1px solid rgba(234, 88, 12, 0.5);
      border-radius: 6px;
      background: rgba(234, 88, 12, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon-inner {
      width: 10px;
      height: 10px;
      border: 1px solid #f97316;
      transform: rotate(45deg);
    }

    .brand-title {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: -0.2px;
    }

    .brand-title span {
      color: #ea580c;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-switch {
      display: flex;
      background: #060911;
      border: 1px solid #172133;
      border-radius: 8px;
      padding: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: #ea580c;
      color: #ffffff;
    }

    .close-btn {
      width: 28px;
      height: 28px;
      background: #060911;
      border: 1px solid #172133;
      border-radius: 8px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .close-btn:hover {
      color: #ffffff;
      border-color: #334155;
    }

    .modal-body {
      text-align: center;
      margin-bottom: 24px;
    }

    .modal-text {
      font-size: 19px;
      line-height: 1.55;
      font-weight: 400;
      color: #f8fafc;
      max-width: 620px;
      margin: 0 auto;
    }

    .divider-line {
      width: 36px;
      height: 2px;
      background: #ea580c;
      margin: 24px auto;
      border-radius: 2px;
    }

    .action-container {
      display: flex;
      justify-content: center;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #a3532f;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 13px 32px;
      border-radius: 12px;
      border: 1px solid rgba(234, 88, 12, 0.3);
      box-shadow: 0 4px 20px rgba(163, 83, 47, 0.3);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .cta-button:hover {
      background: #b85d35;
      box-shadow: 0 6px 25px rgba(234, 88, 12, 0.4);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="modal-overlay" id="promoModal">
    <div class="modal-card">
      
      <div class="modal-header">
        <div class="brand">
          <div class="brand-icon">
            <div class="brand-icon-inner"></div>
          </div>
          <div class="brand-title">AI Act <span>Kontroll</span></div>
        </div>

        <div class="controls">
          <div class="lang-switch">
            <button class="lang-btn active" type="button">HU</button>
            <button class="lang-btn" type="button">EN</button>
          </div>
          <button class="close-btn" type="button" onclick="document.getElementById('promoModal').style.display='none'">✕</button>
        </div>
      </div>

      <div class="modal-body">
        <p class="modal-text">
          Tudta, hogy 2026. augusztus 2-tól az EU AI Act újabb fontos követelményei váltak alkalmazandóvá? Mi lenne, ha néhány perc alatt elkészülne az MI-rendszereihez szükséges szabályzat — a hatályos követelmények alapján?
        </p>
      </div>

      <div class="divider-line"></div>

      <div class="action-container">
        <a href="/bejelentkezes" class="cta-button">
          Nézd meg, hogyan működik →
        </a>
      </div>

    </div>
  </div>

</body>
</html>
